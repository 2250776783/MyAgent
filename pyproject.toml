[project]
name = "myagent"
version = "0.1.0"
description = "个人问答助手 - 学习 RAG 和 Agent 相关知识"
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    "openai>=1.0.0",
    "chromadb>=0.5.0",
    "unstructured>=0.15.0",
    "langchain-text-splitters>=0.3.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "tiktoken>=0.7.0",
    "fpdf2>=2.8.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/myAgent"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "ANN", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
ignore_missing_imports = true
strict = false
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]
